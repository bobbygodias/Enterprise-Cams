name: Android build and QA
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build, unit tests and Android lint
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :qa-stub:assembleDebug --no-daemon --stacktrace
      - name: Prepare installable test APK
        run: |
          mkdir -p delivery
          cp app/build/outputs/apk/debug/app-debug.apk delivery/Enterprise-Cams-0.1.0-debug.apk
          sha256sum delivery/Enterprise-Cams-0.1.0-debug.apk > delivery/SHA256SUMS.txt
          cp docs/INSTALL.md delivery/INSTALL.md
      - uses: actions/upload-artifact@v4
        with:
          name: Enterprise-Cams-0.1.0-debug
          path: delivery/
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented flow tests (isolated simulated vendor app)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r qa-stub/build/outputs/apk/debug/qa-stub-debug.apk
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace; qa_result=$?; adb pull /sdcard/Download/enterprise-qa qa-evidence; adb logcat -d -b crash > crash-logcat.txt; exit "$qa_result"
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Enterprise-Cams-QA
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            qa-evidence/
            crash-logcat.txt
          retention-days: 30
